name: Test site

# Publishes the test website (the same files the app has built in) to GitHub Pages:
# https://evanrobinson1985.github.io/Inspection-browser/
# Needs Settings ▸ Pages ▸ Source: "GitHub Actions" once. GitHub only lets the default
# branch publish to Pages, so this runs from main.
on:
  push:
    branches: [main]
    paths: ['app/src/main/assets/testsite/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/testsite
      - id: deployment
        uses: actions/deploy-pages@v4
